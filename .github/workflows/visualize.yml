name: Croissant Visualization

on:
  pull_request:
    paths:
      - 'datasets/**'
      - 'python/mlcroissant/mlcroissant/scripts/static/**'
      - 'python/mlcroissant/mlcroissant/scripts/templates/gallery.html'
      - 'python/mlcroissant/mlcroissant/scripts/templates/visualizer.html'
      - 'python/mlcroissant/mlcroissant/scripts/visualize.py'
      - 'python/mlcroissant/mlcroissant/scripts/visualize_all.py'
      - 'python/mlcroissant/mlcroissant/scripts/visualize_utils.py'
  push:
    branches:
      - main
    paths:
      - 'datasets/**'
      - 'python/mlcroissant/mlcroissant/scripts/static/**'
      - 'python/mlcroissant/mlcroissant/scripts/templates/gallery.html'
      - 'python/mlcroissant/mlcroissant/scripts/templates/visualizer.html'
      - 'python/mlcroissant/mlcroissant/scripts/visualize.py'
      - 'python/mlcroissant/mlcroissant/scripts/visualize_all.py'
      - 'python/mlcroissant/mlcroissant/scripts/visualize_utils.py'

jobs:
  visualize:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgraphviz-dev
        pip install ./python/mlcroissant[dev]

    - name: Verify dataset visualizer and gallery build
      run: |
        tmpdir=$(mktemp -d)
        cp -R datasets "$tmpdir/datasets"
        python python/mlcroissant/mlcroissant/scripts/visualize_all.py --datasets_dir="$tmpdir/datasets" --force=true
        test -f "$tmpdir/datasets/index.html"
        test -f "$tmpdir/datasets/static/gallery.min.js"
        test -f "$tmpdir/datasets/static/visualizer.min.js"
