<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Croissant Tasks (CT) + E3 Visualizer</title>
  <style>
    /* ── Reset & Base (Ported from MLCommons Croissant visualizer.css) ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: #f8f7f4;
      --color-surface: #ffffff;
      --color-primary: #b45309;
      --color-primary-light: #fef3c7;
      --color-text: #1a1a2e;
      --color-text-secondary: #6b7280;
      --color-border: #e5e7eb;
      --color-border-light: #f3f4f6;
      --color-fo: #f97316;   /* FileObject accent */
      --color-fs: #6366f1;   /* Implementation accent */
      --color-rs: #22c55e;   /* RecordSet accent */
      --color-eval: #0284c7; /* Evaluation / STATO accent */
      --color-exec: #8b5cf6; /* ExecutionConfig accent */
      --color-prob: #d97706; /* TaskProblem accent */
      --sidebar-width: 295px;
      --sidebar-collapsed-width: 0px;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px -1px rgba(0,0,0,0.08), 0 2px 6px -2px rgba(0,0,0,0.05);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--color-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ────────────────────────────────────── */
    .app { display: flex; min-height: 100vh; }

    /* ── Sidebar ───────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      transition: width 0.25s ease;
      z-index: 10;
    }
    .sidebar.collapsed { width: var(--sidebar-collapsed-width); }
    .sidebar-inner { padding: 20px 16px; transition: opacity 0.15s ease; }
    .sidebar.collapsed .sidebar-inner { opacity: 0; pointer-events: none; }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--color-border);
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .sidebar-toggle {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: none;
      color: var(--color-text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-toggle:hover {
      background: var(--color-primary-light);
      color: var(--color-primary);
    }

    .sidebar-open-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }
    .sidebar.collapsed ~ .main .sidebar-open-btn { display: flex; }

    /* Document Switcher in Sidebar */
    .doc-switcher {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 18px;
      background: var(--color-bg);
      padding: 7px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
    }
    .doc-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      text-align: left;
      padding: 7px 9px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .doc-btn:hover {
      background: rgba(255,255,255,0.7);
      color: var(--color-text);
    }
    .doc-btn.active {
      background: var(--color-surface);
      color: var(--color-primary);
      border-color: #fcd34d;
      box-shadow: var(--shadow-sm);
    }
    .doc-btn .doc-type-pill {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 0.61rem;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--color-primary-light);
      color: var(--color-primary);
      white-space: nowrap;
    }

    .sidebar h4 {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-secondary);
      margin: 16px 0 6px;
    }
    .sidebar ul { list-style: none; }
    .sidebar ul li a {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      font-size: 0.81rem;
      color: var(--color-text-secondary);
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar ul li a:hover {
      background: var(--color-primary-light);
      color: var(--color-primary);
      text-decoration: none;
    }

    /* ── Main Content ──────────────────────────────── */
    .main {
      flex: 1;
      min-width: 0;
      padding: 26px 34px 64px;
      max-width: 1060px;
    }

    /* Top File Switcher Bar */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      padding: 10px 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      box-shadow: var(--shadow-sm);
    }
    .top-bar-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .top-tab {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 7px;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text-secondary);
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .top-tab:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .top-tab.active {
      background: linear-gradient(135deg, #92400e 0%, #d97706 100%);
      color: white;
      border-color: #92400e;
    }

    /* ── Hero Header ───────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, #92400e 0%, #d97706 60%, #f59e0b 100%);
      color: white;
      padding: 32px 34px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .hero.hero--solution {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #0ea5e9 100%);
    }
    .hero.hero--agentic {
      background: linear-gradient(135deg, #312e81 0%, #4f46e5 55%, #06b6d4 100%);
    }
    .hero.hero--lower {
      background: linear-gradient(135deg, #065f46 0%, #059669 55%, #10b981 100%);
    }
    .hero.hero--judge {
      background: linear-gradient(135deg, #581c87 0%, #7e22ce 55%, #ec4899 100%);
    }
    .hero-type-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.73rem;
      font-weight: 600;
      background: rgba(0,0,0,0.24);
      padding: 3px 11px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .hero h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .hero .description {
      font-size: 0.92rem;
      line-height: 1.65;
      opacity: 0.94;
      max-width: 820px;
    }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.18);
      padding: 5px 13px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
      backdrop-filter: blur(4px);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .hero-badge.clickable { cursor: pointer; transition: background 0.15s; }
    .hero-badge.clickable:hover { background: rgba(255,255,255,0.3); }

    /* ── Cards ──────────────────────────────────────── */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-sm);
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--color-primary) 0%, #f59e0b 100%);
      border-radius: var(--radius) 0 0 var(--radius);
    }
    .card--green::before  { background: linear-gradient(180deg, var(--color-rs) 0%, #16a34a 100%); }
    .card--blue::before   { background: linear-gradient(180deg, var(--color-eval) 0%, #2563eb 100%); }
    .card--purple::before { background: linear-gradient(180deg, var(--color-exec) 0%, #6366f1 100%); }
    .card--orange::before { background: linear-gradient(180deg, var(--color-fo) 0%, #ea580c 100%); }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border-light);
    }
    .card-header h2 {
      font-size: 1.04rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .card-header .icon { font-size: 1.2rem; }
    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ── Tables ─────────────────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--color-border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }
    thead th {
      text-align: left;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.71rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-secondary);
      background: #f9fafb;
      border-bottom: 1px solid var(--color-border);
    }
    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-border-light);
      vertical-align: top;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }

    /* Key-value metadata table */
    .kv-table { width: 100%; border: none; }
    .kv-table td { padding: 8px 0; border-bottom: 1px solid var(--color-border-light); }
    .kv-table tr:last-child td { border-bottom: none; }
    .kv-table .kv-key {
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--color-text-secondary);
      width: 220px;
      padding-right: 20px;
      vertical-align: top;
      font-family: var(--font-mono);
    }
    .kv-table .kv-val {
      font-size: 0.86rem;
      word-break: break-word;
    }

    /* ── Type & Semantic Chips (Clean, non-duplicative) ─── */
    .type-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      padding: 1px 7px;
      border-radius: 4px;
      color: var(--color-text-secondary);
    }
    .badge-ns {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      margin-right: 5px;
      vertical-align: middle;
      text-transform: lowercase;
    }
    .badge-ns--cr    { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .badge-ns--sc    { background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
    .badge-ns--stato { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .badge-ns--prov  { background: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
    .badge-ns--e3    { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }

    .prop-pill {
      display: inline-flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 2px 8px 2px 4px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-text);
    }

    .key-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      background: #fef9c3;
      color: #854d0e;
      border: 1px solid #fde047;
      padding: 0 5px;
      border-radius: 3px;
      margin-left: 5px;
    }
    .array-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.67rem;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      padding: 0 5px;
      border-radius: 3px;
      margin-left: 4px;
    }

    /* ── Resource & Component Cards ─────────────────── */
    .resource-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .resource-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left-width: 4px;
      border-radius: 8px;
      padding: 15px 18px;
      transition: box-shadow 0.15s;
    }
    .resource-card[data-type="FileObject"] { border-left-color: var(--color-fo); }
    .resource-card[data-type="Dataset"]    { border-left-color: var(--color-prob); }
    .resource-card[data-type="Software"]   { border-left-color: var(--color-fs); }
    .resource-card[data-type="SubTask"]    { border-left-color: #10b981; }
    .resource-card:hover { box-shadow: var(--shadow-md); }
    .resource-card .rc-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      margin-bottom: 6px;
    }
    .resource-card .rc-name { font-weight: 600; font-size: 0.92rem; }

    /* SubTask Grid */
    .subtask-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
    }
    .subtask-item {
      background: #f8fafc;
      border: 1px solid var(--color-border);
      border-left: 3px solid #10b981;
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 0.81rem;
    }

    /* ── Score & STATO Confidence Interval Meter ────── */
    .score-showcase {
      background: linear-gradient(180deg, #f8fafc 0%, #f0f9ff 100%);
      border: 1px solid #bae6fd;
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .score-showcase.lower-better {
      background: linear-gradient(180deg, #f8fafc 0%, #ecfdf5 100%);
      border-color: #a7f3d0;
    }
    .score-top {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .score-big {
      font-size: 2rem;
      font-weight: 800;
      color: #0369a1;
      font-family: var(--font-mono);
    }
    .score-showcase.lower-better .score-big {
      color: #047857;
    }
    .score-bar-track {
      height: 14px;
      background: #e2e8f0;
      border-radius: 7px;
      position: relative;
      overflow: hidden;
      margin: 12px 0 8px;
    }
    .score-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7 0%, #22c55e 100%);
      border-radius: 7px;
    }
    .score-showcase.lower-better .score-bar-fill {
      background: linear-gradient(90deg, #10b981 0%, #f59e0b 100%);
    }
    .score-ci-band {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(250, 204, 21, 0.55);
      border-left: 2px solid #ca8a04;
      border-right: 2px solid #ca8a04;
    }
    .stato-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .stato-stat {
      background: white;
      border: 1px solid #e0f2fe;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stato-stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
    }
    .stato-stat-val {
      font-family: var(--font-mono);
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--color-text);
      margin: 2px 0 4px;
    }

    /* ── SVG Graph Container ────────────────────────── */
    .svg-graph-wrap {
      overflow-x: auto;
      max-width: 100%;
      padding: 14px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 8px;
    }
    .svg-graph-wrap svg g.node-group { cursor: pointer; transition: opacity 0.15s; }
    .svg-graph-wrap svg g.node-group:hover rect.main-box { filter: brightness(0.95); stroke-width: 2.2px; }

    /* ── RecordSet & SubField Hierarchy ─────────────── */
    .subfield-row td:first-child {
      padding-left: 34px;
      position: relative;
    }
    .subfield-row td:first-child::before {
      content: "↳";
      position: absolute;
      left: 16px;
      color: var(--color-text-secondary);
      font-family: var(--font-mono);
    }

    /* ── RecordSet Data Preview (cr:examples) ───────── */
    .rs-preview {
      margin-top: 14px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 14px 16px;
      display: none;
    }
    .rs-preview.open { display: block; }
    .rs-preview-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #15803d;
      margin-bottom: 10px;
    }
    .e3-sample-card {
      background: white;
      border: 1px solid #86efac;
      border-radius: 8px;
      padding: 14px 16px;
      margin-top: 10px;
    }
    .e3-trace-box {
      font-family: var(--font-mono);
      font-size: 0.77rem;
      background: #f8fafc;
      border-left: 3px solid #6366f1;
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 0 6px 6px 0;
    }
    .e3-tool-box {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      background: #1e293b;
      color: #e2e8f0;
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 6px;
    }

    /* ── JSON-LD Toggle & Panels ────────────────────── */
    .jsonld-toggle, .preview-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 5px;
      padding: 2px 8px;
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      transition: all 0.15s;
    }
    .jsonld-toggle:hover, .preview-toggle:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .jsonld-toggle.active {
      background: #1e293b;
      color: #e2e8f0;
      border-color: #1e293b;
    }
    .preview-toggle.active {
      background: #f0fdf4;
      color: #15803d;
      border-color: #86efac;
    }
    .jsonld-panel {
      display: none;
      margin-top: 10px;
    }
    .jsonld-panel.open { display: block; }
    .jsonld-panel pre, .modal-body pre {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.55;
      background: #1e293b;
      color: #e2e8f0;
      padding: 14px 16px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Syntax highlight spans */
    .tok-key { color: #93c5fd; }
    .tok-str { color: #86efac; }
    .tok-num { color: #fde047; }
    .tok-bool { color: #f9a8d4; }
    .tok-kw { color: #fdba74; font-weight: 600; }

    /* ── Modal ──────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--color-surface);
      border-radius: 12px;

    // ── Helpers (Stripping redundant namespace prefixes next to colored chips) ──
    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function stripNs(key) {
      return String(key).replace(/^(croissant|cr|schema|sc|stato|prov|dct|e3):/, '');
    }

    function getNsType(key) {
      if (key.startsWith('croissant:') || key.startsWith('cr:') || ['lowerIsBetter','examples','data','dataType','subField','extract','jsonPath','isArray'].includes(key)) {
        return 'cr';
      }
      if (key.startsWith('schema:') || key.startsWith('sc:')) {
        return 'sc';
      }
      if (key.startsWith('stato:') || ['standardError','confidenceInterval','confidenceLevel','sampleSize','standardDeviation'].includes(key)) {
        return 'stato';
      }
      if (key.startsWith('prov:') || key.startsWith('dct:')) {
        return 'prov';
      }
      if (key.startsWith('e3:')) {
        return 'e3';
      }
      return '';
    }

    function getNsLabel(ns) {
      return ns === 'sc' ? 'schema' : ns;
    }

    // Renders a colored namespace chip + bare property name (NO duplicate prefix!)
    function renderPropWithChip(key, suffixText) {
      const ns = getNsType(key);
      const bare = stripNs(key);
      const chip = ns ? `<span class="badge-ns badge-ns--${ns}">${getNsLabel(ns)}</span>` : '';
      return `${chip}<span>${esc(bare)}${suffixText ? esc(suffixText) : ''}</span>`;
    }

    function renderPropPill(key, valText) {
      const ns = getNsType(key);
      const bare = stripNs(key);
      const chip = ns ? `<span class="badge-ns badge-ns--${ns}">${getNsLabel(ns)}</span>` : '';
      return `<span class="prop-pill">${chip}<strong>${esc(bare)}</strong>${valText !== undefined ? ` = ${esc(valText)}` : ''}</span>`;
    }

    function syntaxHighlightJson(obj) {
      const json = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
      return esc(json).replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
        function (match) {
          if (/^"/.test(match)) {
            if (/:$/.test(match)) {
              if (match.includes('@') || match.includes('croissant:') || match.includes('cr:') || match.includes('stato:') || match.includes('e3:')) {
                return '<span class="tok-kw">' + match + '</span>';
              }
              return '<span class="tok-key">' + match + '</span>';
            }
            return '<span class="tok-str">' + match + '</span>';
          }
          if (/true|false/.test(match)) return '<span class="tok-bool">' + match + '</span>';
          return '<span class="tok-num">' + match + '</span>';
        }
      );
    }

    function jsonldDrawer(obj, idSuffix) {
      return (
        '<div class="jsonld-panel" id="panel-' + esc(idSuffix) + '">' +
          '<pre>' + syntaxHighlightJson(obj) + '</pre>' +
        '</div>'
      );
    }

    // ── SVG Architecture & Topology Graph ────────────────────────────────────
    function buildTopologySvg(data) {
      const docType = stripNs(data['@type'] || 'Task');
      const nodes = [];
      const edges = [];

      nodes.push({
        id: 'root',
        col: 0,
        row: 1,
        title: docType,
        subtitle: (data['schema:name'] || '').slice(0, 26),
        icon: docType.includes('Problem') ? '🎯' : docType.includes('Solution') ? '🚀' : '🥐',
        fill: '#fffbeb',
        stroke: '#d97706',
        href: '#top'
      });

      if (data['schema:isBasedOn']) {
        nodes.push({
          id: 'basedOn',
          col: 0,
          row: 0,
          title: 'isBasedOn -> TaskProblem',
          subtitle: 'MMLU-Pro#problem',
          icon: '🔗',
          fill: '#fef3c7',
          stroke: '#b45309',
          href: '#metadata'
        });
        edges.push({ from: 'root', to: 'basedOn', dashed: true });
      } else if (data['croissant:subTask']) {
        nodes.push({
          id: 'subtasks',
          col: 0,
          row: 0,
          title: 'subTask (' + data['croissant:subTask'].length + ' splits)',
          subtitle: 'Medicine, Law, Finance…',
          icon: '🧩',
          fill: '#ecfdf5',
          stroke: '#10b981',
          href: '#subtasks-section'
        });
        edges.push({ from: 'root', to: 'subtasks', dashed: true });
      }

      if (data['croissant:input']) {
        nodes.push({
          id: 'input',
          col: 1,
          row: 0,
          title: 'input (Dataset)',
          subtitle: data['croissant:input']['e3:hfRepo'] || data['croissant:input']['schema:name'],
          icon: '📥',
          fill: '#fff7ed',
          stroke: '#f97316',
          href: '#input-section'
        });
        edges.push({ from: 'root', to: 'input' });
      }

      if (data['croissant:implementation']) {
        nodes.push({
          id: 'impl',
          col: 1,
          row: 1,
          title: 'implementation',
          subtitle: data['croissant:implementation']['schema:name'],
          icon: '🤖',
          fill: '#eef2ff',
          stroke: '#6366f1',
          href: '#impl-section'
        });
        edges.push({ from: 'root', to: 'impl' });
      }

      if (data['croissant:execution']) {
        const isAgentic = data['croissant:execution']['e3:interactionType'] === 'agentic';
        nodes.push({
          id: 'exec',
          col: 1,
          row: 2,
          title: 'execution',
          subtitle: isAgentic ? 'Docker Sandbox + bash/py' : 'ExecutionConfig',
          icon: isAgentic ? '🐳' : '⚙️',
          fill: '#f5f3ff',
          stroke: '#8b5cf6',
          href: '#exec-section'
        });
        edges.push({ from: 'root', to: 'exec' });
      }

      if (data['croissant:output']) {
        const rsCount = (data['croissant:output']['cr:recordSet'] || []).length || 1;
        nodes.push({
          id: 'output',
          col: 2,
          row: 0.4,
          title: 'output (' + rsCount + ' RecordSet' + (rsCount > 1 ? 's' : '') + ')',
          subtitle: 'subField + examples',
          icon: '📋',
          fill: '#f0fdf4',
          stroke: '#22c55e',
          href: '#recordsets'
        });
        edges.push({ from: 'root', to: 'output' });
      }

      if (data['croissant:evaluation']) {
        const hasJudge = !!data['croissant:evaluation']['croissant:implementation'];
        nodes.push({
          id: 'eval',
          col: 2,
          row: 1.7,
          title: 'evaluation',
          subtitle: hasJudge ? 'LLM Judge (GPT-4o) + STATO' : 'QuantitativeValue + STATO',
          icon: hasJudge ? '⚖️' : '📊',
          fill: '#f0f9ff',
          stroke: '#0284c7',
          href: '#eval-section'
        });
        edges.push({ from: 'root', to: 'eval' });
      }

      const NODE_W = 208, NODE_H = 56;
      const COL_X = [28, 310, 595];
      const ROW_Y = (r) => 28 + r * 82;
      const posMap = {};
      nodes.forEach(n => {
        posMap[n.id] = { x: COL_X[n.col], y: ROW_Y(n.row), cx: COL_X[n.col] + NODE_W / 2, cy: ROW_Y(n.row) + NODE_H / 2 };
      });

      const svgW = 835, svgH = 262;
      let pathsHtml = '';
      edges.forEach(e => {
        const p1 = posMap[e.from];
        const p2 = posMap[e.to];
        if (!p1 || !p2) return;
        const d = (e.to === 'basedOn' || e.to === 'subtasks')
          ? `M${p1.cx},${p1.y} L${p2.cx},${p2.y + NODE_H}`
          : `M${p1.x + NODE_W},${p1.cy} C${(p1.x + NODE_W + p2.x)/2},${p1.cy} ${(p1.x + NODE_W + p2.x)/2},${p2.cy} ${p2.x},${p2.cy}`;
        pathsHtml += `<path d="${d}" fill="none" stroke="#94a3b8" stroke-width="1.7" ${e.dashed ? 'stroke-dasharray="5,3"' : ''} marker-end="url(#arrow)"/>`;
      });

      let nodesHtml = '';
      nodes.forEach(n => {
        const p = posMap[n.id];
        nodesHtml += `
          <a href="${n.href}">
            <g class="node-group" transform="translate(${p.x}, ${p.y})">
              <rect class="main-box" width="${NODE_W}" height="${NODE_H}" rx="9" fill="${n.fill}" stroke="${n.stroke}" stroke-width="1.6"/>
              <rect x="10" y="12" width="32" height="32" rx="7" fill="rgba(255,255,255,0.88)" stroke="${n.stroke}" stroke-width="0.8"/>
              <text x="26" y="33" text-anchor="middle" font-size="16">${n.icon}</text>
              <text x="50" y="24" font-size="11.5" font-weight="700" fill="#1e293b">${esc(n.title)}</text>
              <text x="50" y="41" font-size="10.1" font-family="JetBrains Mono, monospace" fill="#64748b">${esc(n.subtitle)}</text>
            </g>
          </a>
        `;
      });

      return `
        <div class="svg-graph-wrap">
          <svg viewBox="0 0 ${svgW} ${svgH}" width="100%" height="${svgH}">
            <defs>
              <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
              </marker>
            </defs>
            <text x="${COL_X[0] + NODE_W/2}" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.06em">TASK ROOT &amp; SUBTASKS</text>
            <text x="${COL_X[1] + NODE_W/2}" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.06em">INPUT / MODEL / EXECUTION</text>
            <text x="${COL_X[2] + NODE_W/2}" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.06em">OUTPUT RECORDSET &amp; EVALUATION</text>
            ${pathsHtml}
            ${nodesHtml}
          </svg>
        </div>
      `;
    }

            rendered = `<code>${esc(JSON.stringify(val))}</code>`;

                ${engine ? `<tr><td class="kv-key">${renderPropWithChip('e3:inferenceEngine')}</td><td class="kv-val"><strong>${esc(engine['schema:name'])}</strong> <span class="type-badge">v${esc(engine['schema:version'])}</span></td></tr>` : ''}
                <tr><td class="kv-key">${renderPropWithChip('e3:deploymentType')}</td><td class="kv-val"><span class="type-badge">${esc(impl['e3:deploymentType'])}</span></td></tr>
                <tr><td class="kv-key">${renderPropWithChip('e3:modelAvailability')}</td><td class="kv-val"><span class="type-badge">${esc(impl['e3:modelAvailability'])}</span></td></tr>
              </table>
            </div>
            ${jsonldDrawer({ "croissant:implementation": impl }, 'impl')}
          </div>
        `;
      }

      const exec = data['croissant:execution'];
      if (exec) {
        const hps = exec['croissant:hyperparameter'] || [];
        const env = exec['croissant:environment'];
        const tools = exec['e3:availableTools'] || [];

        const hpRows = hps.map(hp => `
          <tr>
            <td><code>${esc(hp['schema:name'])}</code></td>
            <td>${renderPropPill('schema:PropertyValue')}</td>
            <td><strong style="font-family:var(--font-mono)">${esc(hp['schema:value'])}</strong></td>
          </tr>
        `).join('');

        html += `
          <div class="card card--purple" id="exec-section">
            <div class="card-header">
              <span class="icon">⚙️</span>
              <h2>Execution Configuration (${renderPropWithChip('croissant:execution')})</h2>
              <div class="header-actions">
                <button class="jsonld-toggle" data-target="panel-exec">&lt;/&gt;</button>
              </div>
            </div>
            <p style="font-size:0.86rem;color:var(--color-text-secondary);margin-bottom:12px">${esc(exec['schema:description'] || '')}</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
              ${exec['e3:interactionType'] ? renderPropPill('e3:interactionType', exec['e3:interactionType']) : ''}
              ${exec['e3:reasoning'] !== undefined ? renderPropPill('e3:reasoning', String(exec['e3:reasoning'])) : ''}
              ${env ? renderPropPill('croissant:environment', env['schema:name'] + ' (' + env['e3:sandboxType'] + ')') : ''}
            </div>
            ${tools.length ? `
              <div style="margin-bottom:14px;background:#f8fafc;border:1px solid var(--color-border);border-radius:8px;padding:10px 14px">
                <div style="font-size:0.76rem;font-weight:700;margin-bottom:6px">${renderPropWithChip('e3:availableTools')}</div>
                <div style="display:flex;gap:10px;flex-wrap:wrap">
                  ${tools.map(t => `<span class="type-badge">🛠️ <strong>${esc(t['schema:name'])}</strong>: ${esc(t['schema:description'])}</span>`).join('')}
                </div>
              </div>
            ` : ''}
            ${hps.length ? `
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Hyperparameter (${renderPropWithChip('croissant:hyperparameter')})</th><th>RDF Class</th><th>Value</th></tr></thead>
                  <tbody>${hpRows}</tbody>
                </table>
              </div>
            ` : ''}
            ${jsonldDrawer({ "croissant:execution": exec }, 'exec')}
          </div>
        `;
      }

      return html;
    }

    function renderEvaluationSection(data) {
      const ev = data['croissant:evaluation'];
      if (!ev) return '';

      const judgeImpl = ev['croissant:implementation'];
      const expectedMetrics = ev['croissant:expectedMetric'] || [];
      const results = ev['croissant:evaluationResults'] || [];

      let judgeHtml = '';
      if (judgeImpl) {
        judgeHtml = `
          <div class="resource-card" data-type="Software" style="margin-bottom:18px;background:#fdf4ff;border-color:#f0abfc">
            <div class="rc-header">
              <span style="font-size:1.3rem">⚖️</span>
              <span class="rc-name">LLM-as-a-Judge: ${esc(judgeImpl['schema:name'])}</span>
              ${renderPropPill('croissant:implementation', judgeImpl['schema:identifier'])}
              ${renderPropPill('e3:aggregationMethod', judgeImpl['e3:aggregationMethod'])}
              ${renderPropPill('e3:expertBaseline', judgeImpl['e3:expertBaseline'])}
            </div>
          </div>
        `;
      }

      let metricsHtml = '';
      if (expectedMetrics.length) {
        metricsHtml += `
          <h3 style="font-size:0.9rem;margin-bottom:8px">Metric Specifications (${renderPropWithChip('croissant:MetricSpec')})</h3>
          <div class="table-wrap" style="margin-bottom:18px">
            <table>
              <thead>
                <tr>
                  <th>Metric Name</th>
                  <th>${renderPropWithChip('cr:dataType')}</th>
                  <th>${renderPropWithChip('croissant:lowerIsBetter')}</th>
                  <th>Bounds (${renderPropWithChip('schema:minValue')}..${renderPropWithChip('schema:maxValue')})</th>
                  <th>${renderPropWithChip('schema:unitText')}</th>
                </tr>
              </thead>
              <tbody>
                ${expectedMetrics.map(m => {
                  const dt = Array.isArray(m['cr:dataType']) ? m['cr:dataType'].map(stripNs).join(', ') : stripNs(m['cr:dataType']);
                  const lib = m['croissant:lowerIsBetter'];
                  return `
                    <tr>
                      <td><strong>${esc(m['schema:name'])}</strong><br><small style="color:var(--color-text-secondary)">${esc(m['schema:description'])}</small></td>
                      <td><span class="type-badge">${esc(dt)}</span></td>
                      <td>
                        ${renderPropPill('croissant:lowerIsBetter', String(lib))}
                        <small style="color:${lib ? '#047857' : '#0369a1'};font-weight:600;margin-left:4px">
                          ${lib ? '↓ Lower is better' : '↑ Higher is better'}
                        </small>
                      </td>
                      <td><code>[${esc(m['schema:minValue'])}, ${esc(m['schema:maxValue'])}]</code></td>
                      <td><span class="type-badge">${esc(m['schema:unitText'])}</span></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      let resultsHtml = '';
      results.forEach((r) => {
        const qv = r['croissant:value'] || {};
        const score = qv['schema:value'] !== undefined ? qv['schema:value'] : r['croissant:value'];
        const maxVal = Number(qv['schema:maxValue'] || 1.0);
        const ci = qv.confidenceInterval || {};
        const se = qv.standardError || {};
        const isLowerBetter = !!r['croissant:lowerIsBetter'];

        const barPct = Math.min(100, Math.max(1.5, (Number(score) / maxVal) * 100)).toFixed(1);
        const ciLowPct = ((Number(ci['schema:minValue'] || 0) / maxVal) * 100).toFixed(1);
        const ciHighPct = ((Number(ci['schema:maxValue'] || 0) / maxVal) * 100).toFixed(1);
        const displayUnit = qv['schema:unitText'] === 'percent' ? '%' : ` (${(Number(score) * 100).toFixed(1)}%)`;

        resultsHtml += `
          <div class="score-showcase ${isLowerBetter ? 'lower-better' : ''}">
            <div class="score-top">
              <div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">
                  ${renderPropPill('croissant:EvaluationResult')}
                  ${renderPropPill('croissant:lowerIsBetter', String(isLowerBetter))}
                </div>
                <h3 style="font-size:1.05rem;margin-top:4px">${esc(r['schema:name'])} (<code>${esc(r['schema:identifier'])}</code>)</h3>
                <div style="font-size:0.8rem;color:var(--color-text-secondary)">${esc(r['schema:description'] || '')}</div>
              </div>
              <div style="text-align:right">
                <div class="score-big">${Number(score).toFixed(3)}<span style="font-size:0.98rem;font-weight:600;color:#64748b">${esc(displayUnit)}</span></div>
                <div style="font-size:0.74rem;color:#0369a1;font-family:var(--font-mono)">95% CI: [${ci['schema:minValue']}, ${ci['schema:maxValue']}] (±${se['schema:value']})</div>
              </div>
            </div>

            <div class="score-bar-track">
              <div class="score-bar-fill" style="width:${barPct}%"></div>
              <div class="score-ci-band" style="left:${ciLowPct}%;width:${Math.max(0.8, ciHighPct - ciLowPct).toFixed(2)}%"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:0.72rem;font-family:var(--font-mono);color:var(--color-text-secondary)">
              <span>minValue = ${qv['schema:minValue']}</span>
              <span>95% ${esc(ci['schema:measurementMethod'])} CI [${ci['schema:minValue']}, ${ci['schema:maxValue']}]</span>
              <span>maxValue = ${qv['schema:maxValue']}</span>
            </div>

            <div class="stato-grid">
              <div class="stato-stat">
                <div class="stato-stat-label">Point Estimate</div>
                <div class="stato-stat-val">${score}</div>
                <div>${renderPropWithChip('schema:value')}</div>
              </div>
              <div class="stato-stat">
                <div class="stato-stat-label">Standard Error (${esc(se['schema:measurementMethod'])})</div>
                <div class="stato-stat-val">±${se['schema:value']}</div>
                <div>${renderPropWithChip('stato:standardError', ' (0000037)')}</div>
              </div>
              <div class="stato-stat">
                <div class="stato-stat-label">Confidence Interval (${(ci.confidenceLevel || 0.95)*100}%)</div>
                <div class="stato-stat-val">[${ci['schema:minValue']}, ${ci['schema:maxValue']}]</div>
                <div>${renderPropWithChip('stato:confidenceInterval', ' (0000198)')}</div>
              </div>
              <div class="stato-stat">
                <div class="stato-stat-label">Standard Deviation</div>
                <div class="stato-stat-val">${qv.standardDeviation}</div>
                <div>${renderPropWithChip('stato:standardDeviation', ' (0000164)')}</div>
              </div>
              <div class="stato-stat">
                <div class="stato-stat-label">Sample Size (N)</div>
                <div class="stato-stat-val">${Number(qv.sampleSize).toLocaleString()}</div>
                <div>${renderPropWithChip('stato:sampleSize', ' (0000047)')}</div>
              </div>
            </div>
          </div>
        `;
      });

      return `
        <div class="card card--blue" id="eval-section">
          <div class="card-header">
            <span class="icon">📊</span>
            <h2>Evaluation &amp; Statistical Uncertainty (${renderPropWithChip(ev['@type'])})</h2>
            <div class="header-actions">
              <button class="jsonld-toggle" data-target="panel-eval">&lt;/&gt;</button>
            </div>
          </div>
          ${judgeHtml}
          ${metricsHtml}
          ${resultsHtml}
          ${jsonldDrawer({ "croissant:evaluation": ev }, 'eval')}
        </div>
      `;
    }

    function renderDistributionsAndRecordSets(data) {
      const out = data['croissant:output'] || {};
      const dists = out['schema:distribution'] || [];
      let recordSets = out['cr:recordSet'] || [];
      if (!recordSets.length && out['croissant:schema']) {
        recordSets = [out['croissant:schema']];
      }

      let distHtml = '';
      if (dists.length) {
        distHtml = `
          <div class="card" id="resources">
            <div class="card-header">
              <span class="icon">📦</span>
              <h2>Output Distributions (${renderPropWithChip('schema:distribution')})</h2>
              <div class="header-actions">
                <button class="jsonld-toggle" data-target="panel-dists">&lt;/&gt;</button>
              </div>
            </div>
            <div class="resource-list">
              ${dists.map(d => `
                <div class="resource-card" data-type="FileObject">
                  <div class="rc-header">
                    <span style="font-size:1.3rem">📄</span>
                    <span class="rc-name">${esc(d['schema:name'])}</span>
                    ${renderPropPill('cr:FileObject')}
                    ${renderPropPill('schema:encodingFormat', d['schema:encodingFormat'])}
                  </div>
                  <div style="font-family:var(--font-mono);font-size:0.78rem;color:var(--color-text-secondary);margin-top:4px">
                    <div>${renderPropWithChip('schema:contentUrl')}: <code>${esc(d['schema:contentUrl'])}</code></div>
                    <div>${renderPropWithChip('schema:sha256')}: <code>${esc(d['schema:sha256'])}</code></div>
                  </div>
                </div>
              `).join('')}
            </div>
            ${jsonldDrawer({ "schema:distribution": dists }, 'dists')}
          </div>
        `;
      }

      let rsHtml = '';
      if (recordSets.length) {
        const rsSections = recordSets.map((rs, rsIdx) => {
          const keyIds = new Set((rs['cr:key'] || []).map(k => k['@id']));
          const fields = rs['cr:field'] || [];
          const examples = rs.examples || rs['cr:examples'] || [];
          const enumData = rs.data || rs['cr:data'] || [];

          let fieldRows = '';
          fields.forEach(f => {
            const isKey = keyIds.has(f['@id']);
            const subFields = f['cr:subField'] || f.subField || [];
            const jp = f['cr:extract']?.jsonPath || f['cr:source']?.extract?.jsonPath || '';

            fieldRows += `
              <tr>
                <td>
                  <strong>${esc(f['schema:name'])}</strong>
                  ${isKey ? '<span class="key-badge">🔑 KEY</span>' : ''}
                  ${f['cr:isArray'] ? '<span class="array-badge">isArray</span>' : ''}
                </td>
                <td><span class="type-badge">${esc(stripNs(f['cr:dataType'] || (subFields.length ? 'subField (' + subFields.length + ')' : 'Object')))}</span></td>
                <td><code style="font-size:0.74rem;color:#0369a1">${esc(jp)}</code></td>
                <td>${esc(f['schema:description'] || '')}</td>
              </tr>
            `;

            subFields.forEach(sf => {
              const sfJp = sf['cr:extract']?.jsonPath || sf['cr:source']?.extract?.jsonPath || '';
              fieldRows += `
                <tr class="subfield-row">
                  <td>
                    <code>${esc(sf['schema:name'])}</code>
                    ${sf['cr:isArray'] ? '<span class="array-badge">isArray</span>' : ''}
                  </td>
                  <td><span class="type-badge">${esc(stripNs(sf['cr:dataType']))}</span></td>
                  <td><code style="font-size:0.73rem;color:#64748b">${esc(sfJp)}</code></td>
                  <td style="font-size:0.81rem;color:var(--color-text-secondary)">${esc(sf['schema:description'] || '')}</td>
                </tr>
              `;
            });
          });

          // Static Enumeration Data table (cr:data)
          let enumDataHtml = '';
          if (enumData.length) {
            const cols = Object.keys(enumData[0]);
            enumDataHtml = `
              <div class="rs-preview open" style="background:#faf5ff;border-color:#e9d5ff">
                <div class="rs-preview-label" style="color:#6b21a8">
                  <span>🏷️ Croissant Enumeration Records (${renderPropWithChip('cr:data')})</span>
                  ${renderPropPill('cr:dataType', 'Enumeration')}
                </div>
                <div class="table-wrap">
                  <table>
                    <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
                    <tbody>
                      ${enumData.map(row => `
                        <tr>${cols.map(c => `<td style="font-family:var(--font-mono);font-size:0.78rem">${esc(row[c])}</td>`).join('')}</tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            `;
          }

          // Examples Preview (cr:examples)
          let exPreviewHtml = '';
          if (examples.length) {
            const firstEx = examples[0];
            // Check if tabular slice rows (like Vectara domain slices) vs E3 instance record
            if (firstEx.domain !== undefined && firstEx.hallucination_rate !== undefined) {
              const cols = Object.keys(firstEx);
              exPreviewHtml = `
                <div class="rs-preview open" id="preview-rs-${rsIdx}">
                  <div class="rs-preview-label">
                    <span>🔍 Croissant ${renderPropWithChip('cr:examples')} — 7 Domain Subtask Slices</span>
                  </div>
                  <div class="table-wrap">
                    <table>
                      <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
                      <tbody>
                        ${examples.map(row => `
                          <tr>
                            <td><strong>${esc(row.domain)}</strong></td>
                            <td style="font-family:var(--font-mono);color:#047857;font-weight:700">${esc(row.hallucination_rate)}%</td>
                            <td style="font-family:var(--font-mono)">${esc(row.answer_rate)}%</td>
                            <td style="font-family:var(--font-mono)">${esc(row.average_summary_length)} words</td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                </div>
              `;
            } else {
              // Rich E3 Instance Record (Single-turn or Agentic Multi-turn)
              const msgs = firstEx.messages || [];
              const msgsHtml = msgs.map(m => `
                <div style="margin:6px 0;padding:8px 11px;background:#f8fafc;border-left:3px solid ${m.role === 'tool' ? '#f97316' : '#6366f1'};border-radius:0 6px 6px 0;font-size:0.79rem">
                  <div><strong>Turn ${esc(m.turn_idx)} [${esc(m.role)}]</strong> ${m.reasoning_trace ? `· <em>${esc(m.reasoning_trace)}</em>` : ''}</div>
                  ${(m.tool_calls || []).map(tc => `<div class="e3-tool-box">$ ${esc(tc.name)}(${esc(JSON.stringify(tc.arguments))})</div>`).join('')}
                  ${m.content ? `<div style="font-family:var(--font-mono);margin-top:4px">${esc(m.content)}</div>` : ''}
                </div>
              `).join('');

              exPreviewHtml = `
                <div class="rs-preview open" id="preview-rs-${rsIdx}">
                  <div class="rs-preview-label">
                    <span>🔍 Croissant ${renderPropWithChip('cr:examples')} (<code>@type: @json</code>) — Instance Sample Preview</span>
                    <span class="type-badge">sample_id: <strong>${esc(firstEx.sample_id)}</strong></span>
                  </div>
                  <div class="e3-sample-card">
                    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">
                      <span class="type-badge">sample_id: <strong>${esc(firstEx.sample_id)}</strong></span>
                      <span class="type-badge">interaction_type: <strong>${esc(firstEx.interaction_type)}</strong></span>
                      <span class="type-badge">evaluation.score: <strong>${esc(firstEx.evaluation?.score)}</strong> (is_correct: ${esc(firstEx.evaluation?.is_correct)})</span>
                      ${firstEx.token_usage ? `<span class="type-badge">tokens: ${esc(firstEx.token_usage.input_tokens)} in / ${esc(firstEx.token_usage.output_tokens)} out (${esc(firstEx.token_usage.total_tokens)} total)</span>` : ''}
                    </div>
                    <div style="font-size:0.83rem;margin-bottom:6px">
                      <strong>Input Prompt (<code>input.raw</code>):</strong> <code>${esc(firstEx.input?.raw)}</code>
                      · <strong>Reference:</strong> <code>${esc(JSON.stringify(firstEx.input?.reference))}</code>
                    </div>
                    ${firstEx.output?.reasoning_trace ? `
                      <div class="e3-trace-box">
                        <strong>Chain-of-Thought Trace (<code>output.reasoning_trace</code>):</strong><br>
                        ${esc(firstEx.output.reasoning_trace[0])}
                      </div>
                    ` : ''}
                    ${firstEx.output?.raw ? `
                      <div style="font-size:0.83rem;margin-top:6px">
                        <strong>Raw Completion (<code>output.raw</code>):</strong> <code>${esc(firstEx.output.raw[0])}</code>
                      </div>
                    ` : ''}
                    ${msgsHtml}
                    <div style="font-size:0.8rem;color:#15803d;margin-top:6px;font-family:var(--font-mono)">
                      ✓ Answer Attribution: source="${esc(firstEx.answer_attribution?.[0]?.source)}" → extracted_value="<strong>${esc(firstEx.answer_attribution?.[0]?.extracted_value)}</strong>" (method: ${esc(firstEx.answer_attribution?.[0]?.extraction_method)}, is_terminal: ${esc(firstEx.answer_attribution?.[0]?.is_terminal)})
                    </div>
                  </div>
                </div>
              `;
            }
          }

          return `
            <div class="rs-section" id="rs-${esc(rs['schema:name'])}">
              <div class="rs-header" style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
                <h3 style="font-size:1rem">📋 ${esc(rs['schema:name'])}</h3>
                ${rs['cr:dataType'] ? renderPropPill('cr:dataType', stripNs(rs['cr:dataType'])) : ''}
                ${rs.sampleSize ? renderPropPill('stato:sampleSize', Number(rs.sampleSize).toLocaleString() + ' rows') : ''}
                <div class="header-actions">
                  ${examples.length ? `<button class="preview-toggle active" data-preview="preview-rs-${rsIdx}">🔍 examples Preview</button>` : ''}
                  <button class="jsonld-toggle" data-target="panel-rs-${rsIdx}">&lt;/&gt;</button>
                </div>
              </div>
              ${fields.length ? `
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Field / ${renderPropWithChip('cr:subField')}</th>
                        <th>${renderPropWithChip('cr:dataType')}</th>
                        <th>${renderPropWithChip('cr:extract')} (jsonPath)</th>
                        <th>Description</th>
                      </tr>
                    </thead>
                    <tbody>${fieldRows}</tbody>
                  </table>
                </div>
              ` : ''}
              ${enumDataHtml}
              ${exPreviewHtml}
              ${jsonldDrawer(rs, 'rs-' + rsIdx)}
            </div>
          `;
        }).join('<hr style="border:none;border-top:1px solid var(--color-border-light);margin:22px 0">');

        rsHtml = `
          <div class="card card--green" id="recordsets">
            <div class="card-header">
              <span class="icon">📋</span>
              <h2>Record Sets (${renderPropWithChip('cr:RecordSet')}) &amp; ${renderPropWithChip('cr:subField')} Schema</h2>
            </div>
            ${rsSections}
          </div>
        `;
      }

      return distHtml + rsHtml;
    }

    // ── Full Application Render ─────────────────────────────────────────────

      const appHtml = `

              <div class="sidebar-header">
                <div class="sidebar-brand">🥐 Croissant Tasks</div>

                    <span>${esc(v.shortTag)}</span>
                    <span class="doc-type-pill">${esc(v.pill)}</span>
                  </button>
                `).join('')}

              <h4>Sections</h4>

                <li><a href="#top">🏠 Overview &amp; Badges</a></li>
                <li><a href="#graph">🕸️ Task Topology Graph</a></li>
                <li><a href="#metadata">ℹ️ Metadata &amp; Provenance</a></li>
                ${data['croissant:subTask'] ? '<li><a href="#subtasks-section">🧩 Subtasks (7 Splits)</a></li>' : ''}
                ${data['croissant:input'] ? '<li><a href="#input-section">📥 Input Dataset</a></li>' : ''}
                ${data['croissant:implementation'] ? '<li><a href="#impl-section">🤖 Model &amp; Serving</a></li>' : ''}
                ${data['croissant:execution'] ? '<li><a href="#exec-section">⚙️ Execution Config</a></li>' : ''}
                ${data['croissant:evaluation'] ? '<li><a href="#eval-section">📊 Evaluation &amp; STATO</a></li>' : ''}
                <li><a href="#recordsets">📋 Record Sets &amp; Examples</a></li>
              </ul>

              <h4>Namespace Chips Legend</h4>
              <div style="display:flex;flex-wrap:wrap;gap:5px;padding:4px 2px">
                <span class="badge-ns badge-ns--cr">cr</span>
                <span class="badge-ns badge-ns--sc">schema</span>
                <span class="badge-ns badge-ns--stato">stato</span>
                <span class="badge-ns badge-ns--prov">prov</span>
                <span class="badge-ns badge-ns--e3">e3</span>
              </div>
            </div>
          </nav>

          <div class="main">
            <button class="sidebar-open-btn" id="open-sidebar-btn" title="Open sidebar">☰</button>

            <div class="top-bar">
              <div class="top-bar-tabs">
                ${Object.entries(DOCUMENTS).map(([k, v]) => `
                  <button class="top-tab ${k === currentDocKey ? 'active' : ''}" data-doc="${k}">
                    ${esc(v.label)}
                  </button>
                `).join('')}
              </div>
              <button class="jsonld-toggle" id="open-modal-btn" style="padding:6px 12px;font-size:0.75rem">
                &lt;/&gt; Full JSON-LD
              </button>
            </div>

            <div class="${heroClass}" id="top">
              <div class="hero-type-kicker">🥐 ${esc(docType)} · ${esc(docObj.filename)}</div>
              <h1>${esc(data['schema:name'])}</h1>
              <div class="description">${esc(data['schema:description'] || 'Evaluation run linked via isBasedOn to MMLU-Pro#problem.')}</div>
              <div class="hero-meta">
                <span class="hero-badge">🏷️ Croissant 1.1</span>
                <span class="hero-badge">📐 E3 Schema v${esc(data['e3:schemaVersion'] || '0.3.0')}</span>
                <span class="hero-badge">🔧 ${esc(data['e3:evalLibrary']?.['schema:name'] || 'lm-eval')}</span>
                <span class="hero-badge clickable" id="hero-source-btn">&lt;/&gt; View Full JSON-LD</span>
              </div>
            </div>

            <div class="card" id="graph">
              <div class="card-header">
                <span class="icon">🕸️</span>
                <h2>Croissant Tasks Graph Topology</h2>
              </div>
              ${buildTopologySvg(data)}
            </div>

            ${renderMetadataSection(data)}
            ${renderSubTasksSection(data)}
            ${renderInputAndImplSection(data)}
            ${renderEvaluationSection(data)}
            ${renderDistributionsAndRecordSets(data)}

            <div class="footer">
              Generated by 🥐 <strong>Croissant Tasks (CT) + EveryEvalEver (E3) Visualizer</strong> · Styled after MLCommons Croissant 1.1 Visualizer
            </div>
          </div>
        </div>

        <div class="modal-overlay" id="jsonld-modal">
          <div class="modal">
            <div class="modal-header">
              <h2>🥐 ${esc(docObj.filename)}</h2>
              <button class="modal-btn" id="copy-jsonld-btn">📋 Copy JSON-LD</button>
              <button class="modal-btn" id="download-jsonld-btn">⬇️ Download</button>
              <button class="modal-close" id="close-modal-btn">✕</button>
            </div>
            <div class="modal-body">
              <pre id="full-jsonld-code">${syntaxHighlightJson(data)}</pre>
            </div>
          </div>
        </div>
      `;

      document.getElementById('app').innerHTML = appHtml;
      bindEvents(docObj);
    }

    function bindEvents(docObj) {
      document.querySelectorAll('[data-doc]').forEach(btn => {
        btn.addEventListener('click', () => {
          currentDocKey = btn.getAttribute('data-doc');
          render();
        });
      });

      const closeBtn = document.getElementById('close-sidebar-btn');
      const openBtn = document.getElementById('open-sidebar-btn');
      if (closeBtn) closeBtn.onclick = () => document.getElementById('sidebar').classList.add('collapsed');
      if (openBtn) openBtn.onclick = () => document.getElementById('sidebar').classList.remove('collapsed');

      document.querySelectorAll('.jsonld-toggle[data-target]').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const panel = document.getElementById(targetId);
          if (panel) {
            panel.classList.toggle('open');
            btn.classList.toggle('active');
          }
        });
      });

      document.querySelectorAll('.preview-toggle[data-preview]').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-preview');
          const panel = document.getElementById(targetId);
          if (panel) {
            panel.classList.toggle('open');
            btn.classList.toggle('active');
          }
        });
      });

      const modal = document.getElementById('jsonld-modal');
      const openModal = () => { modal.classList.add('open'); };
      const closeModal = () => { modal.classList.remove('open'); };

      document.getElementById('open-modal-btn').onclick = openModal;
      document.getElementById('hero-source-btn').onclick = openModal;
      document.getElementById('close-modal-btn').onclick = closeModal;
      modal.onclick = (e) => { if (e.target === modal) closeModal(); };

      document.getElementById('copy-jsonld-btn').onclick = function () {
        navigator.clipboard.writeText(JSON.stringify(docObj.jsonld, null, 2));
        this.textContent = '✓ Copied!';
        setTimeout(() => { this.textContent = '📋 Copy JSON-LD'; }, 1800);
      };

      document.getElementById('download-jsonld-btn').onclick = function () {
        const blob = new Blob([JSON.stringify(docObj.jsonld, null, 2)], { type: 'application/ld+json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = docObj.filename;
        a.click();
      };
    }

    render();
  </script>
</body>
</html>
